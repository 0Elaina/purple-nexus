[project]
name = "purple-nexus-agent"
version = "0.1.0"
description = "AI orchestration service for Purple Nexus"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.140.0",
    "langchain>=1.3.14",
    "langgraph>=1.2.9",
    "pydantic-settings>=2.14.2",
    "qdrant-client>=1.18.0",
    "redis>=8.0.1",
    "uvicorn>=0.51.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
filterwarnings = ["error"]
