spring:
  application:
    name: purple-nexus-server

  config:
    # 将没有扩展名的 .env 按 properties 格式读取
    import: "optional:file:./.env[.properties]"

  profiles:
    active: "${SPRING_PROFILES_ACTIVE}"

  datasource:
    url: "${SPRING_DATASOURCE_URL}"
    username: "${SPRING_DATASOURCE_USERNAME}"
    password: "${SPRING_DATASOURCE_PASSWORD}"

  data:
    redis:
      host: "${SPRING_DATA_REDIS_HOST}"
      port: "${SPRING_DATA_REDIS_PORT}"
      password: "${SPRING_DATA_REDIS_PASSWORD}"

agent:
  base-url: "${AGENT_BASE_URL}"
  service-token: "${AGENT_SERVICE_TOKEN}"

s3:
  endpoint: "${S3_ENDPOINT}"
  access-key: "${S3_ACCESS_KEY}"
  secret-key: "${S3_SECRET_KEY}"
  bucket: "${S3_BUCKET}"
  region: "${S3_REGION}"
  path-style-access: "${S3_PATH_STYLE_ACCESS}"

management:
  endpoints:
    web:
      exposure:
        # 暴露 health 端点
        include: "health"

  endpoint:
    health:
      # 不显示健康状态的详细信息
      show-details: "never"
      probes:
        # 创建 liveness 和 readiness 健康分组
        enabled: true

      # 配置 liveness 和 readiness 健康分组
      group:
        # livenessState: 检查 Spring 应用是否存活
        liveness:
          include: "livenessState"
        # readiness: 检查应用是否准备就绪
        readiness:
          # readinessState: 检查 Spring 应用自身是否准备就绪
          # db: 检查 PostgreSQL 是否可以访问
          # redis: 检查 Redis 是否可以访问
          # s3: 使用 HeadBucket 检查目标 RustFS 存储桶是否可以访问
          include: "readinessState, db, redis, s3, agent"

mybatis:
  configuration:
    # 开启下划线转驼峰自动映射
    map-underscore-to-camel-case: true
    # 基于参数名称的构造函数自动映射
    arg-name-based-constructor-auto-mapping: true

logging:
  file:
    name: "${LOG_FILE:logs/purple-nexus-server.log}"
  threshold:
    console: DEBUG
    file: INFO
  level:
    root: INFO
    "[com.purple.project]": DEBUG
