name: purple-nexus

services:
  postgres:
    image: postgres:18.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - infrastructure
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s

  redis:
    image: redis:8.2.7-bookworm
    restart: unless-stopped
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - >
        exec redis-server
        --appendonly yes
        --appendfsync everysec
        --requirepass "$$REDIS_PASSWORD"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - infrastructure
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.18.3-unprivileged
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?QDRANT_API_KEY is required}
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - infrastructure
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333;
          printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          grep -q "HTTP/1.1 200" <&3'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s

  rustfs:
    image: rustfs/rustfs:1.0.0-beta.11
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    networks:
      - infrastructure
    healthcheck:
      # Bucket initialization must wait until both the S3 API and console are ready.
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent --show-error http://127.0.0.1:9000/health >/dev/null && curl --fail --silent --show-error http://127.0.0.1:9001/rustfs/console/health >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 30s
    stop_grace_period: 30s

  rustfs-init:
    image: rustfs/rc:v0.1.28
    restart: "no"
    security_opt:
      - no-new-privileges:true
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY is required}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY is required}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:?RUSTFS_BUCKET is required}
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        rc alias set --quiet local http://rustfs:9000 \
          "$$RUSTFS_ACCESS_KEY" \
          "$$RUSTFS_SECRET_KEY"
        rc mb --ignore-existing --no-color "local/$$RUSTFS_BUCKET"
    networks:
      - infrastructure

networks:
  infrastructure:
    name: purple-nexus-infrastructure

volumes:
  postgres-data:
    name: purple-nexus-postgres-data
  redis-data:
    name: purple-nexus-redis-data
  qdrant-data:
    name: purple-nexus-qdrant-data
  rustfs-data:
    name: purple-nexus-rustfs-data
