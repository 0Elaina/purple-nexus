# Purple Nexus 的合并前质量检查
name: CI

on:
  # 检查准备合入集成分支或发布分支的代码
  pull_request:
    branches:
      - main
      - develop

  # 合并后再次检查最终提交
  push:
    branches:
      - main
      - develop

# 当前 CI 只需读取源码, 不能修改仓库
permissions:
  contents: read

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest

    # 只对本 job 中的 run 命令生效
    defaults:
      run:
        working-directory: apps/web

    # VITE_ 变量会进入浏览器产物, 因此只能使用公开值
    env:
      VITE_API_BASE_URL: http://localhost:8080

    steps:
      # 将当前提交下载到临时虚拟机
      - name: Checkout repository
        uses: actions/checkout@v6

      # 与 apps/web/package.json 中的 packageManager 保持一致
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      # 使用项目指定的 Node.js 24, 并缓存 pnpm 软件包
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      # 严格按照现有锁文件安装依赖
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build application
        run: pnpm build

  server:
    name: Server
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_DB: purple_nexus_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d purple_nexus_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: apps/server

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/purple_nexus_ci
      SPRING_DATASOURCE_USERNAME: ci
      SPRING_DATASOURCE_PASSWORD: ci-postgres-password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # 在当前临时运行器中准备可被 Maven Toolchains 发现的 JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/server/pom.xml

      # mvnw 当前没有 Linux 可执行位，因此显式交给 Bash 运行
      # verify 会完成编译和现有测试，作品集成测试连接本 job 的临时 PostgreSQL
      - name: Run Maven verification
        run: bash ./mvnw verify

  agent:
    name: Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # 准备 uv 和项目基线要求的 Python 3.13。
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          working-directory: apps/agent
      # 按照 uv.lock 创建环境；锁文件不一致时直接失败。
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run Ruff lint
        run: uv run ruff check .
      # 只检查格式，不修改 CI 中的源码。
      - name: Check Ruff formatting
        run: uv run ruff format --check .
      # 现有测试使用假配置和依赖替身，不连接 Redis 或 Qdrant。
      - name: Run tests
        run: uv run pytest
  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-latest

    # 仅用于解析 compose.yaml 的临时占位输入。
    env:
      POSTGRES_DB: purple_nexus_ci
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci-placeholder-postgres
      REDIS_PASSWORD: ci-placeholder-redis
      QDRANT_API_KEY: ci-placeholder-qdrant
      RUSTFS_ACCESS_KEY: ci-placeholder-rustfs
      RUSTFS_SECRET_KEY: ci-placeholder-rustfs-secret
      RUSTFS_BUCKET: purple-nexus-ci-assets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # 只验证 Compose 结构和变量契约，不启动任何服务。
      - name: Validate Compose configuration
        run: docker compose config
